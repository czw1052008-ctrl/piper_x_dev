fine_detector_node:
  ros__parameters:
    mesh_path: ""
    foundation_pose_root: "/home/user/codes/piper_x_dev/FoundationPose"
    enable_foundation_pose: false
    publish_hz: 10.0
    est_refine_iter: 5
    track_refine_iter: 2
    score_threshold: 0.3
    max_detections: 6
    # mask_source: yolo (custom trained) | hsv
    mask_source: yolo
    yolo_model: /home/user/codes/piper_x_dev/blueberry_picking_ws/runs/detect/blueberry-7/weights/best.pt
    yolo_open_vocab: false
    yolo_classes: "blueberry"
    # Locked mid-range tracking: keep this high so BoT-SORT stays sticky.
    # After-center / entry unlock uses yolo_unlocked_conf_threshold (detect only).
    yolo_conf_threshold: 0.28
    yolo_unlocked_conf_threshold: 0.10
    yolo_min_area_px: 120
    # Was 0.04 → rejected berries closer than ~0.07m (blocks cup contact ~0.04m).
    yolo_max_area_frac: 0.18
    yolo_min_circularity: 0.45
    yolo_max_aspect_ratio: 2.0
    enable_tracking: true
    # Calibrated 2026-08-05: tape cam→berry ≈15cm while mono@0.015→~13cm; scale d.
    berry_diameter_m: 0.017
    # Pose Z: mono (bbox) | depth (RGB-D blend). Default mono for DaBai.
    depth_pose_source: mono
    depth_min_m: 0.03
    depth_max_m: 1.8
    track_lost_max_frames: 8

global_detector_node:
  ros__parameters:
    mask_source: yolo
    # Custom blueberry-4 misfires on arm/cup in this scene; use open-vocab for coarse plant lock.
    yolo_model: yoloe-11s-seg-pf.pt
    yolo_open_vocab: true
    yolo_classes: "blueberry plant,blueberries,blueberry"
    yolo_conf_threshold: 0.45
    yolo_min_area_px: 400
    yolo_max_area_frac: 0.22
    yolo_min_circularity: 0.08
    yolo_max_aspect_ratio: 3.5
    berry_diameter_m: 0.08
    camera_focal_px: 900.0
    publish_hz: 10.0
    min_mask_px: 200
    max_mask_px: 80000
