fine_detector_node:
  ros__parameters:
    mesh_path: ""
    foundation_pose_root: "/home/user/codes/piper_x_dev/FoundationPose"
    enable_foundation_pose: false
    publish_hz: 3.0
    est_refine_iter: 5
    track_refine_iter: 2
    score_threshold: 0.3
    max_detections: 6
    # mask_source: yolo (custom trained) | hsv
    mask_source: yolo
    yolo_model: /home/user/codes/piper_x_dev/blueberry_picking_ws/runs/detect/blueberry-4/weights/best.pt
    yolo_open_vocab: false
    yolo_classes: "blueberry"
    yolo_conf_threshold: 0.38
    yolo_min_area_px: 120
    yolo_max_area_frac: 0.04
    yolo_min_circularity: 0.45
    yolo_max_aspect_ratio: 2.0
    enable_tracking: true
    berry_diameter_m: 0.015
    depth_min_m: 0.03
    depth_max_m: 1.8
    track_lost_max_frames: 8
